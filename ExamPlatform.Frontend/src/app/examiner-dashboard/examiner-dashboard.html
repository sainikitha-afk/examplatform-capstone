<!-- Examiner Dashboard -->
<div class="container mt-4">
  <h3><i class="bi bi-speedometer2 me-2"></i>Welcome, {{ fullName }}!</h3>
  <p class="text-muted">Manage your exams and question bank.</p>

  <div *ngIf="isLoading()" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div *ngIf="!isLoading()" class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card text-center border-secondary">
        <div class="card-body">
          <i class="bi bi-file-earmark-text display-4 text-secondary"></i>
          <h2 class="mt-2">{{ countByStatus('Draft') }}</h2>
          <p class="text-muted mb-0">Draft Exams</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center border-success">
        <div class="card-body">
          <i class="bi bi-broadcast display-4 text-success"></i>
          <h2 class="mt-2">{{ countByStatus('Published') }}</h2>
          <p class="text-muted mb-0">Published</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-center border-primary">
        <div class="card-body">
          <i class="bi bi-clipboard-check display-4 text-primary"></i>
          <h2 class="mt-2">{{ countByStatus('ResultsPublished') }}</h2>
          <p class="text-muted mb-0">Results Published</p>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3">
    <a routerLink="/manage-exams" class="btn btn-primary me-2">
      <i class="bi bi-file-earmark-plus me-1"></i>Manage Exams
    </a>
    <a routerLink="/manage-questions" class="btn btn-outline-secondary">
      <i class="bi bi-question-circle me-1"></i>Question Bank
    </a>
  </div>
</div>
