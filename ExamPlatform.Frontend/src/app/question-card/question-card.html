<!-- Question Card — displays one question and its four answer options -->
<div class="card mb-3 shadow-sm">
  <div class="card-header">
    <!-- Interpolation: question text -->
    <strong>{{ question.questionText }}</strong>
    <span class="badge bg-secondary ms-2">{{ question.marks }} mark(s)</span>
    <span class="badge bg-info ms-1 text-dark">{{ question.difficulty }}</span>
  </div>
  <div class="card-body">
    <!-- *ngFor: render one list item per answer option -->
    <div
      *ngFor="let opt of question.options"
      class="form-check p-3 mb-2 rounded"
      style="cursor:pointer;"
      [ngClass]="{
        'bg-primary text-white': isSelected(opt.optionId),
        'bg-light': !isSelected(opt.optionId)
      }"
      (click)="handleOptionSelect(opt)"
    >
      <!-- Property binding: sets the input checked state -->
      <input
        class="form-check-input"
        type="radio"
        [checked]="isSelected(opt.optionId)"
        [name]="'q' + question.questionId"
        (change)="handleOptionSelect(opt)"
      />
      <!-- Interpolation: option text -->
      <label class="form-check-label ms-1" style="cursor:pointer;">{{ opt.optionText }}</label>
    </div>
  </div>
</div>
