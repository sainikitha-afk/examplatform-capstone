<!-- question-card.html — Premium MCQ option card with selection animation -->

<div class="qcard animate-fade-in">
  <p class="qcard-text">{{ question.questionText }}</p>

  <div class="qcard-options">
    <!-- *ngFor: one option item per answer option -->
    <div
      *ngFor="let opt of question.options; let i = index"
      class="qcard-option"
      [class.selected]="isSelected(opt.optionId)"
      (click)="handleOptionSelect(opt)"
    >
      <!-- Option letter label (A, B, C, D) -->
      <div class="qopt-letter" [class.selected-letter]="isSelected(opt.optionId)">
        {{ 'ABCD'[i] }}
      </div>

      <!-- CONCEPT DEMO: radio input + property binding for checked state -->
      <input
        class="qopt-radio"
        type="radio"
        [checked]="isSelected(opt.optionId)"
        [name]="'q' + question.questionId"
        (change)="handleOptionSelect(opt)"
      />

      <!-- Interpolation: option text -->
      <label class="qopt-label">{{ opt.optionText }}</label>

      <i class="bi bi-check-circle-fill qopt-check" *ngIf="isSelected(opt.optionId)"></i>
    </div>
  </div>
</div>
