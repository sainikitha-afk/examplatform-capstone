<!-- manage-users.html — Admin: paginated user management table with activate/deactivate -->

<div class="container py-4 animate-fade-in">

  <div class="page-header">
    <h3><i class="bi bi-people me-2 text-primary"></i>Manage Users</h3>
    <p class="page-header-sub">View and manage all platform accounts.</p>
  </div>

  <!-- Alerts -->
  <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center gap-2"><i class="bi bi-check-circle-fill"></i>{{ successMessage }}</div>
  <div *ngIf="errorMessage"   class="alert alert-danger  d-flex align-items-center gap-2"><i class="bi bi-exclamation-circle-fill"></i>{{ errorMessage }}</div>

  <div *ngIf="isLoading" class="text-center py-4">
    <div class="spinner-border text-primary"></div>
  </div>

  <!-- Empty state -->
  <div *ngIf="!isLoading && users.length === 0" class="empty-state">
    <span class="empty-icon">👤</span>
    <h5>No users found</h5>
    <p>Registered users will appear here.</p>
  </div>

  <!-- Users table -->
  <div *ngIf="!isLoading && users.length > 0" class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Name</th>
              <th>Username</th>
              <th>Email</th>
              <th class="text-center">Role</th>
              <th class="text-center">Status</th>
              <th class="text-center">Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- *ngFor: one row per user; [ngClass]: dim inactive rows -->
            <tr *ngFor="let u of users" [ngClass]="{'row-inactive': !u.isActive}">
              <td class="fw-medium">{{ u.fullName }}</td>
              <td class="text-muted" style="font-size:0.88rem">{{ u.username }}</td>
              <td class="text-muted" style="font-size:0.88rem">{{ u.email }}</td>
              <td class="text-center">
                <span class="role-pill"
                      [ngClass]="{
                        'role-admin':     u.role === 'Admin',
                        'role-examiner':  u.role === 'Examiner',
                        'role-candidate': u.role === 'Candidate'
                      }">
                  {{ u.role }}
                </span>
              </td>
              <td class="text-center">
                <span class="badge-status" [ngClass]="u.isActive ? 'badge-published' : 'badge-failed'">
                  {{ u.isActive ? 'Active' : 'Inactive' }}
                </span>
              </td>
              <td class="text-center">
                <!-- *ngIf: admins cannot be deactivated, so no button on Admin rows -->
                <button *ngIf="u.role !== 'Admin'"
                        class="btn btn-sm"
                        [ngClass]="u.isActive ? 'btn-outline-danger' : 'btn-outline-success'"
                        (click)="handleToggleActiveClick(u)">
                  {{ u.isActive ? 'Deactivate' : 'Activate' }}
                </button>
                <span *ngIf="u.role === 'Admin'" class="text-muted">—</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <nav *ngIf="totalPages > 1" class="mt-3">
    <ul class="pagination justify-content-center">
      <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index"
          [class.active]="currentPage === i + 1">
        <button class="page-link" (click)="handlePageChange(i + 1)">{{ i + 1 }}</button>
      </li>
    </ul>
  </nav>

</div>
