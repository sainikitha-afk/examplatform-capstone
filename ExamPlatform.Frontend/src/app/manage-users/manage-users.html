<!-- Manage Users (Admin) — paginated table with toggle active -->
<div class="container mt-4">
  <h3><i class="bi bi-people me-2"></i>Manage Users</h3>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  <div *ngIf="isLoading" class="text-center py-4"><div class="spinner-border text-primary"></div></div>

  <table class="table table-striped table-hover" *ngIf="!isLoading">
    <thead class="table-dark">
      <tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody>
      <!-- *ngFor: one row per user -->
      <tr *ngFor="let u of users"
          [ngClass]="{'table-secondary opacity-75': !u.isActive}">
        <td>{{ u.fullName }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>
          <span class="badge"
                [ngClass]="{'bg-warning text-dark': u.role==='Admin','bg-info text-dark': u.role==='Examiner','bg-secondary': u.role==='Candidate'}">
            {{ u.role }}
          </span>
        </td>
        <td>
          <span [ngClass]="{'text-success fw-bold': u.isActive, 'text-danger': !u.isActive}">
            {{ u.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
        <td>
          <!-- Event binding: toggle active status -->
          <button class="btn btn-sm"
                  [ngClass]="{'btn-outline-danger': u.isActive, 'btn-outline-success': !u.isActive}"
                  (click)="handleToggleActiveClick(u)">
            {{ u.isActive ? 'Deactivate' : 'Activate' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <p *ngIf="!isLoading && users.length === 0" class="text-muted">No users found.</p>

  <!-- Pagination -->
  <nav *ngIf="totalPages > 1">
    <ul class="pagination">
      <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index">
        <button class="page-link"
                [ngClass]="{'active': currentPage === i+1}"
                (click)="handlePageChange(i+1)">{{ i+1 }}</button>
      </li>
    </ul>
  </nav>
</div>
