<!-- Publish Results page -->
<div class="container mt-4">
  <h3><i class="bi bi-clipboard-check me-2"></i>Publish Results</h3>
  <p class="text-muted">These exams are Published and waiting for results to be released.</p>

  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  <div *ngIf="isLoading" class="text-center py-4"><div class="spinner-border text-primary"></div></div>

  <div *ngIf="!isLoading && exams.length === 0 && !errorMessage" class="alert alert-info">
    No published exams awaiting result release.
  </div>

  <div class="list-group" *ngIf="!isLoading">
    <div *ngFor="let e of exams" class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <strong>{{ e.title }}</strong>
        <span class="text-muted ms-2 small">{{ e.durationMinutes }} min · {{ e.totalMarks }} marks</span>
      </div>
      <button class="btn btn-sm btn-primary" (click)="handlePublishResultsClick(e.examId, e.title)">
        <i class="bi bi-send-check me-1"></i>Publish Results
      </button>
    </div>
  </div>
</div>
